[project]
name = "tcv"
version = "0.1.0"
description = "Type-routed claim verification for long-form research synthesis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Krish Garg" },
    { name = "Kanishka Yadav" },
    { name = "Kushel Rohilla" },
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "anthropic>=0.60",
    "google-genai>=1.0",
]

[project.scripts]
tcv = "tcv.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"   # run slow tests with: uv run pytest -m slow
markers = [
    "slow: loads the real embedding model or real papers (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Architectural rules, enforced — see architecture.md §1 and §3.2.
# Run with:  uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "tcv"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the Researcher may import retrieval"
type = "forbidden"
source_modules = [
    "tcv.agents",
    "tcv.checker",
    "tcv.orchestrator",
    "tcv.eval",
    "tcv.baselines",
    "tcv.llm",
    "tcv.inspect",
]
forbidden_modules = ["tcv.retrieval"]
ignore_imports = ["tcv.agents.researcher -> tcv.retrieval.**"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Composition operators are pure code (no model, no retrieval)"
type = "forbidden"
source_modules = ["tcv.checker.operators"]
forbidden_modules = ["tcv.llm", "tcv.retrieval", "anthropic", "google", "sentence_transformers"]

[[tool.importlinter.contracts]]
name = "Only the gateway touches the provider SDKs"
type = "forbidden"
source_modules = [
    "tcv.schemas",
    "tcv.corpus",
    "tcv.retrieval",
    "tcv.agents",
    "tcv.checker",
    "tcv.orchestrator",
    "tcv.eval",
    "tcv.baselines",
    "tcv.inspect",
]
forbidden_modules = ["anthropic", "google"]  # google = the Gen AI SDK (google.genai)
# Direct imports only: every component legitimately reaches the SDK *through*
# the gateway — that funnel is the point. (Operators, above, stay strict:
# they must not reach a model even indirectly.)
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Schemas depend on nothing else in the package"
type = "forbidden"
source_modules = ["tcv.schemas"]
forbidden_modules = [
    "tcv.corpus",
    "tcv.retrieval",
    "tcv.llm",
    "tcv.agents",
    "tcv.checker",
    "tcv.orchestrator",
    "tcv.eval",
    "tcv.baselines",
    "tcv.inspect",
    "tcv.cli",
]
